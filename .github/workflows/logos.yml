name: logos
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: investool-write, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python engine/logos.py
      - run: |
          git config user.name investool-bot; git config user.email bot@investool
          git add -A logos; git commit -m "logos" || exit 0
          git pull --rebase -X theirs && git push
