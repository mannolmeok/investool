name: probe
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pykrx pandas
      - run: python probe/probe.py
      - run: |
          git config user.name investool-bot; git config user.email bot@investool
          git add probe/result.json; git commit -m "probe result" || true; git push
