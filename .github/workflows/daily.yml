name: daily-lines
on:
  schedule:
    # 정시 실행은 Cloudflare 정시 알람(15:43 · 06:13 KST)이 맡음. 아래는 그게 실패했을 때를 위한 늦은 예비
    - cron: "43 9 * * 1-5"   # 18:43 KST 예비
    - cron: "43 23 * * 1-5"  # 08:43 KST 예비
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: investool-write, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y fonts-noto-cjk >/dev/null
      - run: pip install -r requirements.txt
      - run: python engine/selftest.py
      - run: python engine/run_daily.py
      - run: python engine/push.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}            # 선택
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # 선택
      - name: commit outputs
        run: |
          git config user.name "investool-bot"
          git config user.email "bot@investool"
          git add logos data out
          git commit -m "daily: $(date -u +%F)" || echo "no changes"
          git pull --rebase -X theirs && git push
