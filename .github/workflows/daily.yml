name: daily-lines
on:
  schedule:
    # GitHub 크론은 정각/10분 단위에 몰려 지연·누락이 잦음 → 어중간한 분 + 30분 뒤 재시도
    - cron: "43 6 * * 1-5"   # 15:43 KST 국내 마감 후
    - cron: "17 7 * * 1-5"   # 16:17 KST 재시도
    - cron: "13 20 * * 1-5"  # 05:13 KST 미국 마감 후
    - cron: "47 20 * * 1-5"  # 05:47 KST 재시도
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: investool-write, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y fonts-noto-cjk >/dev/null
      - run: pip install -r requirements.txt
      - run: python engine/selftest.py
      - run: python engine/run_daily.py
      - run: python engine/push.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}            # 선택
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # 선택
      - name: commit outputs
        run: |
          git config user.name "investool-bot"
          git config user.email "bot@investool"
          git add data out
          git commit -m "daily: $(date -u +%F)" || echo "no changes"
          git pull --rebase -X theirs && git push
