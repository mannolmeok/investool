name: daily-lines
on:
  schedule:
    - cron: "40 6 * * 1-5"   # 15:40 KST 국내 마감 후
    - cron: "10 20 * * 1-5"  # 05:10 KST 미국 마감 후
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y fonts-noto-cjk >/dev/null
      - run: pip install -r requirements.txt
      - run: python engine/run_daily.py
      - run: python engine/push.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      - name: commit outputs
        run: |
          git config user.name "investool-bot"
          git config user.email "bot@investool"
          git add data out
          git commit -m "daily: $(date -u +%F)" || echo "no changes"
          git push
