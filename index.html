<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141517" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>investool</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<script>(function(){try{var t=localStorage.getItem('theme')||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<style>
/* investool v3.2 — 결론 먼저 · 쉬운 말 · PC는 화면 전체 + 차트가 주인공
   색은 뜻이 하나씩: 빨강/파랑 = 가격 오름/내림만 · 청록 = 기회 · 주황 = 주의 · 채움 = 지금 판단 · 옅음 = 근접 · 회색 = 기다림 */
:root{
  color-scheme:dark;
  --bg:#141517;--card:#1C1D20;--s2:#25272B;--s3:#2A2C31;--s4:#34363B;--line:#2F3136;--bar:#17181B;
  --t1:#F1F2F4;--t2:#B6BAC1;--t3:#8E939B;--t4:#5A5E66;
  --up:#FF5C5C;--dn:#4C9BFF;
  --go:#34C3A0;--go-ink:#062A20;--go-tint:rgba(52,195,160,.16);--go-t:#5FD6B8;--go-soft:rgba(52,195,160,.12);--go-note:#D6F5EC;
  --wa:#F2B24C;--wa-ink:#2B1B00;--wa-tint:rgba(242,178,76,.16);--wa-t:#F5C26B;--wa-soft:rgba(242,178,76,.12);--wa-note:#F8E3BC;
  --track:#3A3D43;--tick:#45484E;--tick2:#6B6F76;--scrim:rgba(0,0,0,.6);
  --shadow:0 16px 48px rgba(0,0,0,.55);
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --num:'Barlow','IBM Plex Sans KR',system-ui,sans-serif;
  --cond:'Barlow Condensed','Barlow',system-ui,sans-serif;
  --sb:env(safe-area-inset-bottom,0px);
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#F2F3F5;--card:#FFFFFF;--s2:#EDEFF2;--s3:#E7E9ED;--s4:#DCDFE4;--line:#E3E5E9;--bar:#FFFFFF;
  --t1:#15171A;--t2:#454A52;--t3:#646973;--t4:#A0A5AD;
  --up:#CC2A31;--dn:#1A66D6;
  --go:#0C7F64;--go-ink:#FFFFFF;--go-tint:rgba(12,127,100,.12);--go-t:#08705A;--go-soft:rgba(12,127,100,.09);--go-note:#0A5545;
  --wa:#F0A72E;--wa-ink:#2B1B00;--wa-tint:rgba(214,138,10,.16);--wa-t:#7F4E00;--wa-soft:rgba(214,138,10,.11);--wa-note:#6A4100;
  --track:#D9DCE1;--tick:#C3C7CD;--tick2:#8D929A;--scrim:rgba(20,24,30,.45);
  --shadow:0 16px 48px rgba(20,24,30,.2);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:600}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--go);outline-offset:2px;border-radius:8px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:0}
.nr{font-family:var(--num);font-variant-numeric:tabular-nums}
.nb{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:600;line-height:1}
.up{color:var(--up)}.dn{color:var(--dn)}.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.go-t{color:var(--go-t)}.wa-t{color:var(--wa-t)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}
.ico{display:block}

/* ---------- 틀 ---------- */
#main{max-width:600px;margin:0 auto;padding:env(safe-area-inset-top,0px) 16px calc(96px + var(--sb))}
body.no-tab #main{padding-bottom:calc(104px + var(--sb))}
.loading{padding:48px 0;text-align:center;color:var(--t3);font-size:14px}
.empty{padding:20px 16px;color:var(--t3);font-size:14px;text-align:center}
.ib{width:44px;height:44px;border:0;background:transparent;color:var(--t2);display:inline-flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
.ib:hover{background:var(--s2)}
.ph{height:56px;display:flex;align-items:center;gap:10px;margin-right:-10px}
.ph h1{font-size:22px;font-weight:700}
.ph .sub{font-size:12px;color:var(--t3);padding-top:4px}
.ph .end{margin-left:auto;display:flex}
.th{height:52px;display:flex;align-items:center;gap:8px;margin:0 -10px 0 -12px}
.th .tn{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.th .tc{font-family:var(--num);font-size:13px;color:var(--t3);padding-top:2px;flex:none}
.th .end{margin-left:auto;display:flex;flex:none}
.back-h{height:52px;display:flex;align-items:center;gap:6px;margin-left:-12px}
.back-h h1{font-size:17px;font-weight:700}

/* 홈 머리 — 큰 숫자 */
.hh{height:64px;display:flex;align-items:center;gap:12px;margin-right:-10px}
.hh .big{font-family:var(--cond);font-size:52px;font-weight:600;line-height:1;letter-spacing:-1px;min-width:24px;font-variant-numeric:tabular-nums}
.hh .ttl{font-size:16px;font-weight:700;display:block}
.hh .meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t3);flex-wrap:wrap;row-gap:0}
.hh .meta>span{display:inline-flex;align-items:center;gap:4px}
.lamp{width:8px;height:8px;border-radius:4px;border:2px solid var(--t4);display:inline-block;flex:none}
.lamp.go{border-color:var(--go)}.lamp.fill{background:var(--go);border-color:var(--go)}.lamp.wa{border-color:var(--wa)}

/* 섹션 머리 */
.sh{min-height:44px;display:flex;align-items:center;gap:8px;margin-top:12px}
.sh h2{font-size:17px;font-weight:700}
.sh .sub{font-size:12px;color:var(--t3)}
.cnt{font-family:var(--num);font-size:14px;font-weight:600;color:var(--t2);background:var(--s2);border-radius:10px;padding:0 7px;line-height:20px;font-variant-numeric:tabular-nums}
.sh .more{margin-left:auto;min-height:44px;display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--t2);background:none;border:0;padding:0 0 0 8px}

/* 카드 · 목록 */
.card{background:var(--card);border-radius:16px;padding:16px}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 10px 10px 14px;min-height:56px;position:relative;width:100%;text-align:left;background:none;border:0}
a.row:hover,button.row:hover{background:var(--s2)}
.list>.row+.row::before,.list>.row+.exp::before,.list>.exp+.row::before,.list>.exp+.exp::before{content:'';position:absolute;top:0;right:0;left:62px;height:1px;background:var(--line)}
.row.mid{align-items:center}.row.mid .lg{margin-top:0}
.row.cmp{padding:9px 10px 9px 12px;min-height:52px;gap:10px;align-items:center}
.row.cmp .lg{margin-top:0}
.row.cmp::before{left:56px!important}
.lg{width:36px;height:36px;border-radius:50%;flex:none;display:block;object-fit:cover;background:#fff;margin-top:2px}
.mono-lg{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;line-height:1}
.rc{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt{display:flex;align-items:center;gap:8px;min-width:0}
.nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l1{font-size:14px}
.l2{font-size:12px;color:var(--t3)}
.chev{align-self:center;color:var(--t4)}
.rr{display:flex;flex-direction:column;align-items:flex-end;flex:none;align-self:center}
.rr .p{font-family:var(--num);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.rr .c{font-family:var(--num);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.spark{display:block;align-self:center;flex:none}
.morebtn{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;min-height:48px;border:0;background:none;color:var(--t2);font-size:14px;position:relative}
.list>.morebtn::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--line)}
.morebtn:hover{background:var(--s2)}

/* 상태 알약 */
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;flex:none;line-height:1}
.pill.md{height:26px;padding:0 11px;font-size:13px;gap:5px}
.p-go{background:var(--go);color:var(--go-ink)}
.p-floor{background:var(--go-tint);color:var(--go-t)}
.p-ceil{background:var(--wa-tint);color:var(--wa-t)}
.p-stop{background:var(--wa);color:var(--wa-ink)}
.p-wait{background:var(--s3);color:var(--t2)}

/* 보유 카드 */
.hold{display:block;background:var(--card);border-radius:16px;padding:14px 16px}
.hold+.hold{margin-top:10px}
.hold-h{display:flex;align-items:center;gap:12px}
.hold-h .lg{width:40px;height:40px;margin:0}
.hold .px{font-family:var(--cond);font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.hold .pc{font-family:var(--num);font-size:14px;font-weight:600}
.pl{margin-top:12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ruler{display:block;margin-top:12px;width:100%;height:auto;overflow:visible}
.rl{margin-top:4px;display:flex;justify-content:space-between;gap:8px;font-size:12px}
.rl b{font-family:var(--num);font-weight:600}
.act{margin-top:10px;background:var(--s2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.4}
.act svg{color:var(--t2)}

/* 시장 · 일정 · 링크 */
.wx{display:flex;align-items:center;gap:12px}
.wx-i{width:44px;height:44px;border-radius:12px;background:var(--s2);color:var(--t2);display:flex;align-items:center;justify-content:center;flex:none}
.wx b{display:block;font-size:16px;font-weight:600}
.wx span{font-size:13px;color:var(--t2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:3px 10px;border-radius:999px;font-size:13px;background:var(--s2);color:var(--t2)}
.chip.go{background:var(--go-tint);color:var(--go-t)}.chip.wa{background:var(--wa-tint);color:var(--wa-t)}
.idx{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--t2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.idx b{color:var(--t1);font-family:var(--num);font-weight:600;margin:0 4px}
.ev{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative}
.list>.ev+.ev::before{content:'';position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.evb{min-width:44px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--num);font-size:12px;font-weight:600;background:var(--s2);color:var(--t2);flex:none;padding:0 6px}
.evb.today{background:var(--t1);color:var(--bg);font-family:var(--sans)}
.evb.soon{background:var(--wa);color:var(--wa-ink)}
.ev .rc span:first-child{font-size:14px}
.ev .tag{font-size:12px;color:var(--t3);flex:none}
.ev .tag.mine{color:var(--t1)}.ev .tag.watch{color:var(--t2)}
.lk{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;position:relative}
.list>.lk+.lk::before{content:'';position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.lk:hover{background:var(--s2)}
.lk-i{width:36px;height:36px;border-radius:10px;background:var(--s2);color:var(--t2);display:flex;align-items:center;justify-content:center;flex:none}

/* ---------- 종목 ---------- */
.tp{display:flex;align-items:flex-end;gap:12px;padding-top:4px;flex-wrap:wrap}
.tp .big{font-family:var(--cond);font-size:52px;font-weight:600;line-height:.95;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.tp .chg{font-family:var(--num);font-size:16px;font-weight:600}
.tp .asof{font-size:12px;color:var(--t3)}
.live{display:none;align-items:center;gap:5px;font-size:12px;color:var(--go-t)}
.live.on{display:inline-flex}
.live i{width:6px;height:6px;border-radius:3px;background:var(--go);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.flash{animation:flash .9s}@keyframes flash{0%{background:rgba(255,255,255,.16)}100%{background:transparent}}
.livewarn{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:14px;background:var(--wa-tint);color:var(--wa-t)}
.livewarn.hard{background:var(--wa);color:var(--wa-ink)}
.verdict{margin-top:14px;background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.verdict .vh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.verdict h1{font-size:19px;font-weight:700;line-height:1.4}
.verdict .mine{font-size:13px;color:var(--t2);display:flex;flex-wrap:wrap;gap:4px 12px;padding-top:10px;border-top:1px solid var(--line)}
.verdict .mine b{color:var(--t1);font-family:var(--num);font-weight:600}
.dial{display:block;width:100%;max-width:326px;height:auto;margin:0 auto;overflow:visible}
.conds .crow{min-height:64px;display:flex;align-items:center;gap:12px;padding:10px 14px;position:relative}
.conds .crow+.crow::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--line)}
.crow.now{background:var(--s2)}
.ci{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.ci.go{background:var(--go-tint);color:var(--go-t)}.ci.wa{background:var(--wa-tint);color:var(--wa-t)}.ci.mid{background:var(--s4);color:var(--t1)}
.crow .cm{flex:1;min-width:0;display:flex;flex-direction:column}
.crow .cm>span:first-child{font-size:15px;font-weight:600}
.crow .cm>span:last-child{font-size:12px;color:var(--t3)}
.crow.now .cm>span:last-child{color:var(--t2)}
.crow .ca{font-size:14px;font-weight:600;text-align:right;flex:none;max-width:42%}
.crow .ca.go{color:var(--go-t)}.crow .ca.wa{color:var(--wa-t)}
.nowtag{display:inline-flex;align-items:center;gap:6px}
.nowtag i{font-style:normal;font-size:12px;font-weight:600;color:var(--bg);background:var(--t1);border-radius:6px;padding:0 6px;line-height:20px}
.seg{height:48px;display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px}
.seg button{flex:1;height:40px;border:0;border-radius:9px;background:transparent;color:var(--t3);font-size:14px;min-width:0}
.seg button[aria-pressed=true]{background:var(--s4);color:var(--t1);font-weight:600}
.seg.sm{height:40px;padding:3px}.seg.sm button{height:34px;font-size:13px}
.chartbox{background:var(--card);border-radius:16px;padding:12px 4px 8px;margin-top:12px}
#chart{height:300px}
.clg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px 2px;font-size:12px;color:var(--t2)}
.clg i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.clg i.band{height:8px;border:0;border-radius:2px}
.clg i.dash{border-top-style:dashed}
.clg .tg{margin-left:auto;border:0;background:none;color:var(--t2);font-size:13px;min-height:36px;padding:0 4px}
.pmap{background:var(--card);border-radius:16px;padding:6px 0}
.pm{display:grid;grid-template-columns:76px 20px minmax(0,1fr);gap:0 10px;padding:10px 14px 10px 10px;align-items:start;position:relative}
.pm .pv{display:flex;flex-direction:column;align-items:flex-end;padding-top:1px}
.pm .pv b{font-family:var(--num);font-size:15px;font-weight:600}
.pm .pv small{font-family:var(--num);font-size:12px;color:var(--t3)}
.pm .rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.pm .rail::before{content:'';position:absolute;top:-10px;bottom:-10px;left:50%;width:2px;margin-left:-1px;background:var(--line)}
.pm:first-child .rail::before{top:12px}.pm:last-child .rail::before{bottom:calc(100% - 12px)}
.pm .dot{position:relative;width:12px;height:12px;border-radius:6px;margin-top:5px;background:var(--card);border:2px solid var(--t4)}
.pm .dot.go{border-color:var(--go);background:var(--go)}.pm .dot.wa{border-color:var(--wa);background:var(--wa)}.pm .dot.now{width:14px;height:14px;border-radius:7px;margin-top:4px;background:var(--t1);border-color:var(--t1);box-shadow:0 0 0 3px var(--s2)}.pm .dot.hollow{background:var(--card)}
.pm .pd{display:flex;flex-direction:column;gap:2px;min-width:0}
.pm .pd>span:first-child{font-size:15px;font-weight:600}
.pm .pd>span:nth-child(2){font-size:13px;color:var(--t2)}
.pm.now{background:var(--s2)}
.pm .dots{font-size:12px;letter-spacing:1px;margin-left:4px}
.pm .more{margin-top:8px;background:var(--s2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:6px;line-height:1.5}
.pm .more b{color:var(--t1);margin-right:6px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{height:46px;padding:0 12px;border:0;background:transparent;color:var(--t3);font-size:15px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.tabs button[aria-selected=true]{color:var(--t1);border-bottom-color:var(--t1)}
.tabp{background:var(--card);border-radius:16px;margin-top:12px;padding:16px}
.tabp.flush{padding:0;overflow:hidden}
.rsn{display:flex;gap:12px;padding:14px 16px;position:relative}
.rsn+.rsn::before{content:'';position:absolute;top:0;left:64px;right:0;height:1px;background:var(--line)}
.rsn-i{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--s3);color:var(--t2)}
.rsn-i.go{background:var(--go-tint);color:var(--go-t)}.rsn-i.wa{background:var(--wa-tint);color:var(--wa-t)}
.rsn .rc>span:first-child{font-size:15px;font-weight:600}
.rsn .rc>span:last-child{font-size:13px;color:var(--t2);line-height:1.5}
.rsn .rc b{color:var(--t1);font-family:var(--num)}
.counter{margin:0 16px 14px;padding:10px 12px;border-radius:10px;background:var(--s2);font-size:13px;color:var(--t2);line-height:1.5}
.counter b{color:var(--t1);font-weight:600}
.lead{font-size:17px;font-weight:700;line-height:1.4}
.lead-s{font-size:13px;color:var(--t2);margin-top:4px}
.cap{font-size:12px;color:var(--t3);margin-top:16px}
.fchart,.qchart{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.kchips .chip b{color:var(--t1);font-family:var(--num);font-weight:600}
.two{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.two div{font-size:13px;color:var(--t2);line-height:1.5}
.two div b{color:var(--t1)}
.kv{display:flex;flex-direction:column;margin-top:14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.kv div span:first-child{color:var(--t2)}
.kv div b{font-family:var(--num);font-weight:600}
.scb{margin-top:14px;background:var(--s2);border-radius:12px;padding:12px 14px}
.scb-h{display:flex;justify-content:space-between;align-items:baseline}
.scb-h b{font-family:var(--num);font-size:20px}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:12px;color:var(--t2)}
.bars>div{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;gap:8px;align-items:center}
.bars i{display:block;height:6px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}
.bars i em{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--t2)}
.bars span:last-child{text-align:right;font-family:var(--num);font-weight:600;color:var(--t1)}
.mtf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mtf>div{background:var(--s2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.mtf .k{font-size:13px;color:var(--t3)}.mtf .v{font-size:16px;font-weight:600}.mtf .d{font-size:12px;color:var(--t2)}
.note{margin-top:8px;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.note.go{background:var(--go-soft);color:var(--go-note)}.note.wa{background:var(--wa-soft);color:var(--wa-note)}
.plan{display:flex;flex-direction:column}
.plan>div{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;position:relative;font-size:14px}
.plan>div+div::before{content:'';position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.plan .pn{font-family:var(--num);font-weight:600}
.plan .ps{font-size:12px;color:var(--t3)}.plan .ps.done{color:var(--go-t)}
.actbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(16px + var(--sb));background:var(--bar);border-top:1px solid var(--line);z-index:30}
.actbar .in{max-width:568px;margin:0 auto;display:flex;gap:10px}
.btn{height:48px;border:0;border-radius:12px;padding:0 16px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--t1);color:var(--bg)}
.btn.sec{background:var(--s2);color:var(--t1)}
.btn.sq{width:48px;padding:0;flex:none}
.btn.grow{flex:1}
.btn.sm{height:40px;font-size:14px;border-radius:10px;padding:0 14px}
.btn:disabled{opacity:.5;cursor:default}
.tk-pcbar{display:none}

/* ---------- 알림 ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.filters::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--t2);font-size:14px;white-space:nowrap;flex:none}
.fchip .n{font-size:13px}
.fchip[aria-pressed=true]{background:var(--t1);border-color:var(--t1);color:var(--bg);font-weight:600}
.fchip.dd::after{content:'';width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-3px);margin-left:4px}
.day{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--t3);margin:16px 2px 8px}
.day b{color:var(--t1)}.day.past b{color:var(--t2)}
.exp{position:relative}
.exp .row{cursor:pointer}
.detail{margin:0 12px 12px 62px;display:flex;flex-direction:column;gap:10px}
.detail .box{background:var(--s2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:6px;line-height:1.5}
.detail .box b{color:var(--t1);margin-right:6px}
.detail .btns{display:flex;gap:8px}
.past .row{min-height:52px;align-items:center}
.past .row .lg{width:28px;height:28px;margin:0}
.past .list>.row+.row::before{left:54px}

/* ---------- 발굴 ---------- */
.lgnd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--t3);margin:10px 2px 8px;gap:8px}
.lgnd span:last-child{display:inline-flex;align-items:center;gap:6px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:60px;position:relative;width:100%;text-align:left;background:none;border:0}
.list>.srow+.srow::before{content:'';position:absolute;top:0;left:70px;right:0;height:1px;background:var(--line)}
.srow:hover{background:var(--s2)}
.srow .rk{width:18px;text-align:center;font-family:var(--num);font-size:12px;color:var(--t3);flex:none}
.srow .lg{margin:0}
.srow .sc{font-family:var(--num);font-size:20px;font-weight:600;min-width:28px;text-align:right;flex:none}
.star-ic{color:var(--wa);display:inline-block;vertical-align:-2px;margin-left:4px}

/* ---------- 기록 ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi>span{font-size:13px;color:var(--t3)}
.kpi>b{font-family:var(--num);font-size:24px;font-weight:600}
.kpi>small{font-size:12px;color:var(--t3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px}
.cal-h{font-size:12px;color:var(--t3);text-align:center}
.cal-d{position:relative;min-height:44px;border-radius:8px;background:var(--s2);padding:4px 5px;font-size:12px;color:var(--t3)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--t2)}
.cal-d.win{background:color-mix(in srgb,var(--up) 22%,var(--s2))}.cal-d.loss{background:color-mix(in srgb,var(--dn) 22%,var(--s2))}
.cal-d em{display:block;font-style:normal;font-family:var(--num);font-size:12px;color:var(--t1);margin-top:2px}
.cal-d i{position:absolute;right:5px;top:7px;width:6px;height:6px;border-radius:3px;background:var(--up)}

/* ---------- 설정 ---------- */
.sg{font-size:13px;color:var(--t3);margin:20px 4px 8px}
.set{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;position:relative;width:100%;text-align:left;background:none;border:0}
.list>.set+.set::before{content:'';position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
a.set:hover,button.set:hover{background:var(--s2)}
.set .rc>span:first-child{font-size:15px}
.set .rc>span:last-child{font-size:12px;color:var(--t3)}
.set .rc>span:only-child{color:var(--t1);font-size:15px}
.set .val{font-size:14px;color:var(--t2);display:inline-flex;align-items:center;gap:6px}
.set .dot{width:8px;height:8px;border-radius:4px;background:var(--go)}
.set .dot.off{background:var(--t4)}
.sw{width:52px;height:32px;border-radius:16px;border:0;background:var(--track);position:relative;flex:none;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:var(--t2);transition:transform .18s}
.sw[aria-checked=true]{background:var(--go)}
.sw[aria-checked=true]::after{transform:translateX(20px);background:#fff}
.sw:disabled{opacity:.7;cursor:default}
.tile{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.tile.go{background:var(--go);color:var(--go-ink)}.tile.floor{background:var(--go-tint);color:var(--go-t)}.tile.stop{background:var(--wa);color:var(--wa-ink)}.tile.mid{background:var(--s3);color:var(--t2)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--t2)}
.field input,.field textarea{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--t1);min-width:0;width:100%}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--t3)}
.msg{font-size:13px;color:var(--t2);line-height:1.5}
.msg.bad{color:var(--wa-t)}.msg.ok{color:var(--go-t)}

/* 용어 · 규칙 · 성적 */
.gl{display:flex;gap:12px;padding:14px 16px;position:relative}
.list>.gl+.gl::before{content:'';position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.gi{display:block;flex:none;width:96px;height:54px;border-radius:10px;background:var(--s2);padding:3px}
.gl .rc>span:first-child{font-size:15px;font-weight:600}
.gl .rc>span:nth-child(2){font-size:12px;color:var(--t3)}
.gl .rc>span:last-child{font-size:13px;color:var(--t2);line-height:1.5}
.rate{display:flex;align-items:center;gap:10px}
.rate i{flex:1;height:8px;border-radius:4px;background:var(--track);position:relative}
.rate i em{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.rate i u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--t2)}
.rate b{font-family:var(--num);font-size:16px;min-width:44px;text-align:right}

/* 검색 */
.search .sbar{display:flex;align-items:center;gap:8px;height:56px;margin-left:-12px}
.search input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;color:var(--t1)}
.search input:focus{outline:none;border-color:var(--t3)}
.sres .row{align-items:center}
.sres .row .lg{margin:0}

/* 아래 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--sb));padding-bottom:var(--sb);background:var(--bar);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--t3);position:relative}
.tabbar a[aria-current=page]{color:var(--t1);font-weight:600}
.bdg{min-width:18px;height:18px;border-radius:9px;background:var(--t1);color:var(--bg);font-family:var(--num);font-size:12px;font-weight:700;line-height:18px;text-align:center;padding:0 5px;font-style:normal}
.tabbar .bdg{position:absolute;top:7px;left:50%;margin-left:6px}
body.no-tab .tabbar{display:none}

/* ---------- 내 종목 · 공용 부품 ---------- */
.mseg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--card);border-radius:12px;padding:3px;margin:2px 0 4px}
.mseg a{height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--t2)}
.mseg a[aria-selected=true]{background:var(--s4);color:var(--t1);font-weight:700}
.mseg .n{font-size:13px;color:var(--t3)}
.pfsum{margin-top:12px}
.pfsum .pv{display:flex;align-items:baseline;gap:10px;margin-top:2px;flex-wrap:wrap}
.pfsum .pv .nb{font-size:44px}
.pfsum .pv .t2{font-size:14px}
.pfsum .pl{margin-top:6px}
.mstat{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.mstat>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.mstat>div>span{font-size:12px;color:var(--t3)}
.mstat b{font-family:var(--num);font-size:20px;font-weight:600;line-height:1.25}
.mstat small{font-size:12px;color:var(--t3)}
.hold2{padding:14px 16px 16px}
.hold2+.hold2{margin-top:10px}
.hold2 .btns{display:flex;gap:8px;margin-top:12px}
.hold2 .btns .btn{height:44px;font-size:15px}
.vplan{display:flex;flex-direction:column}
.vst{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:0 10px;position:relative;padding:6px 0;align-items:start}
.vst::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line)}
.vst:first-child::before{top:14px}.vst:last-child::before{bottom:calc(100% - 14px)}
.vst .dot{width:14px;height:14px;border-radius:7px;margin:3px 0 0 4px;border:2px solid var(--t4);background:var(--card);position:relative;z-index:1}
.vst .dot.done{background:var(--go);border-color:var(--go)}
.vst .dot.next{border-color:var(--go);box-shadow:0 0 0 3px var(--go-tint)}
.vst .t{display:flex;flex-direction:column;min-width:0}
.vst .t b{font-size:14px;font-weight:600}
.vst .t span{font-size:13px;color:var(--t2)}
.vst .t span.t3{color:var(--t3);font-size:12px}
.p-out{background:transparent;color:var(--go-t);box-shadow:inset 0 0 0 1.5px var(--go)}
.mini-h{font-size:13px;color:var(--t2);font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.mini-h .r{margin-left:auto;font-weight:400;color:var(--t3);font-size:12px}
.stack{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px}
.stack i{display:block;min-width:2px}
.lgd2{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--t2)}
.lgd2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lgd2 b{color:var(--t1)}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}
span.tg{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;border:1px solid var(--s4);color:var(--t2);font-size:12px;font-weight:500;line-height:1;white-space:nowrap;flex:none;font-family:var(--sans)}
span.tg.wa{border-color:var(--wa-tint);color:var(--wa-t)}
span.tg.go{border-color:var(--go-tint);color:var(--go-t)}
span.tg.off{color:var(--t3)}
.fbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fbar.m{margin-top:12px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.fbar.m::-webkit-scrollbar{display:none}
.more2{margin-left:auto;min-height:44px;display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--t2);font-size:13px;padding:0 6px;flex:none}
.more2+.more2{margin-left:0}
.more2.on{color:var(--t1);font-weight:700}
.mgrp{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:13px;color:var(--t3)}
.mgrp b{color:var(--t1);font-size:15px}
.mgrp .r{margin-left:auto;font-size:12px}
.sdot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}
.sdot.go{background:var(--go)}.sdot.floor{border:2px solid var(--go)}.sdot.ceil{border:2px solid var(--wa)}.sdot.stop{background:var(--wa)}.sdot.wait{border:2px solid var(--t4)}.sdot.hd{background:var(--t2)}
.erow{align-items:center}
.erow .eb{display:flex;flex:none;margin-right:-6px}
.erow .eb .ib:disabled{opacity:.35;cursor:default}
.stp{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--card)}
.stp.done{background:var(--go-soft);border-color:var(--go-tint)}
.stp.next{border-color:var(--go)}
.stp .h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.stp .h .pill{margin-left:auto}
.stp .c{font-size:14px}
.stp .f{font-size:12px;color:var(--t3)}
.menu{position:fixed;z-index:60;width:220px;background:var(--s2);border:1px solid var(--s4);border-radius:12px;padding:6px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.menu a,.menu button{height:44px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:14px;color:var(--t1);text-align:left;width:100%}
.menu a:hover,.menu button:hover:not(:disabled){background:var(--s4)}
.menu button:disabled{opacity:.45;cursor:default}
.menu button.wa-t{color:var(--wa-t)}
.menu hr{border:0;border-top:1px solid var(--s4);margin:4px 6px}
.rtip{position:fixed;z-index:60;background:var(--s2);border:1px solid var(--s4);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:320px}
.rtip .rt b{font-size:13px}

/* 시트 · 토스트 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:var(--card);border-radius:20px 20px 0 0;z-index:51;padding:6px 16px calc(20px + var(--sb));transform:translateY(105%);transition:transform .25s ease;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--track);margin:6px auto 10px}
.sheet .shh{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sheet .shh h2{font-size:18px;font-weight:700}
.sheet .shh .end{margin-left:auto;display:flex;align-items:center;gap:4px}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translate(-50%,16px);background:var(--t1);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:70;max-width:min(92vw,480px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- PC ---------- */
.topbar{display:none}
@media (min-width:1024px){
  .tabbar,.actbar{display:none!important}
  body,body.no-tab{}
  #main{max-width:none;margin:0;padding:0}
  .topbar{display:flex;position:sticky;top:0;z-index:40;height:64px;align-items:center;gap:20px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--line)}
  .brand{font-family:var(--num);font-size:18px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
  .brand i{width:7px;height:7px;border-radius:4px;background:var(--go)}
  .tnav{display:flex;gap:4px}
  .tnav a{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:10px;font-size:14px;color:var(--t2)}
  .tnav a[aria-current=page]{background:var(--s2);color:var(--t1);font-weight:600}
  .tsearch{flex:1;max-width:440px;position:relative}
  .tsearch label{display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 12px;color:var(--t3)}
  .tsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px;color:var(--t1)}
  .tsearch kbd{font-family:var(--num);font-size:12px;color:var(--t2);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:20px}
  .tsearch .drop{position:absolute;top:46px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:60vh;overflow:auto}
  .tmkt{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--t2);white-space:nowrap}
  .tmkt b{color:var(--t1);font-family:var(--num);font-weight:600}
  .tmkt .wxs{display:inline-flex;align-items:center;gap:6px}
  .page{max-width:880px;margin:0 auto;padding:12px 24px 64px}
  .page.wide{max-width:1120px}
  .ph{display:none}
  .page>.ph,.page .ph.keep{display:flex}
  .hh,.th,.mob{display:none!important}
  .tk-pcbar{display:flex;align-items:center;gap:16px}
  .tk-pcbar .lg{width:48px;height:48px;margin:0}
  .tk-pcbar .nmw{display:flex;flex-direction:column;gap:2px;min-width:0}
  .tk-pcbar .nmw>div{display:flex;align-items:baseline;gap:10px}
  .tk-pcbar .nm1{font-size:24px;font-weight:700}
  .tk-pcbar .cd{font-family:var(--num);font-size:13px;color:var(--t3)}
  .tk-pcbar .px{font-family:var(--cond);font-size:34px;font-weight:600;line-height:1}
  .tk-pcbar .end{margin-left:auto;display:flex;gap:8px;align-items:center}
  .tk-mprice{display:none}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:86vh;border-radius:20px;transform:translate(-50%,-46%);opacity:0;padding-bottom:20px;transition:transform .2s ease,opacity .2s ease}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
