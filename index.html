<style>

*{box-sizing:border-box}

.card{border-left:3px solid var(--line)}

.bar h1.lgrow{align-items:center}

.card-one{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.45}
/* 가로 레벨 바 */
.lb{position:relative;height:78px;margin:8px 8px 0}
.lb-track{position:absolute;left:0;right:0;top:36px;height:4px;background:var(--track);border-radius:2px}
.lb-mark{position:absolute;top:2px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--c);white-space:nowrap;line-height:1.2}
.lb-mark i{order:3;width:2px;height:9px;background:var(--c);margin-top:1px}
.lb-mark b{order:1;font-weight:600}.lb-mark span{order:2;font-size:10px;color:var(--dim)}
.lb-mark.alt{top:40px}
.lb-mark.alt i{order:1;margin:0 0 1px}.lb-mark.alt b{order:2}.lb-mark.alt span{order:3}
.lb-now{position:absolute;top:30px;transform:translateX(-50%);z-index:2}
.lb-now i{display:block;width:3px;height:16px;background:var(--w);border-radius:2px;box-shadow:0 0 0 2px var(--bg)}
.lb-now span{font-size:10px;color:var(--w);margin-top:2px;background:var(--bg);padding:0 3px}
/* 3구간 바 */
.zb{position:relative;height:78px;margin:10px 14px 0}
.zb-seg{position:absolute;top:30px;height:20px;border-radius:2px;overflow:hidden}
.zb-seg span{position:absolute;left:0;right:0;top:3px;font-size:10.5px;font-weight:600;text-align:center;white-space:nowrap}
.zb-seg.dn{background:rgba(79,156,249,.35);color:var(--dn)}.zb-seg.warn{background:rgba(245,166,35,.3);color:var(--warn)}.zb-seg.up{background:rgba(242,92,92,.35);color:var(--up)}
.zb-tick{position:absolute;top:52px;transform:translateX(-50%);font-size:10px;color:var(--dim)}
.zb-tick span{display:block;margin-top:4px}
.zb-now{position:absolute;top:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.zb-now i{width:0;height:0;border:6px solid transparent;border-top:8px solid var(--w)}
.zb-now span{font-size:10px;color:var(--w);font-weight:600}
/* 사다리 */
.ladder{position:relative;margin:14px 12px 16px 12px;font-size:12px}
.ld-axis{position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--track)}
.ld-row{position:absolute;left:0;right:0;transform:translateY(-50%);display:grid;grid-template-columns:16px 1fr auto 56px;gap:8px;align-items:center;color:var(--dim);font-size:12px}
.ld-row.below .ld-n{opacity:.9}
.ld-dot{position:relative;width:8px;height:8px;border-radius:4px;background:var(--c);margin-left:3px}
.ld-n{color:var(--c)}.ld-p{color:var(--txt)}.ld-d{text-align:right;font-size:11px}
.ld-row.conf .ld-n::after{content:' ★';color:var(--ok)}
.ld-row.now{--c:#FFFFFF;color:var(--w);font-weight:700}.ld-row.now .ld-n{color:var(--w)}.ld-row.now .ld-dot{width:10px;height:10px;border-radius:5px;margin-left:2px;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--w)}
.ld-now{position:absolute;left:0;right:0;transform:translateY(-50%);border-top:1px dashed var(--w);z-index:1;pointer-events:none}
.ld-now span{position:absolute;right:0;top:-20px;background:var(--w);color:var(--bg);font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px}
.ld-row{padding-left:0}
.ld-row .ld-n{margin-left:0}
/* 기여도 바 */
.cb{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px}
.cb-seg{position:relative;min-width:2px}
.cb-seg span{position:absolute;left:6px;top:3px;font-size:11px;color:#111;font-weight:600;white-space:nowrap}
/* key-value */
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 10px;padding:10px 12px;font-size:12px;border-top:1px solid var(--line)}
.kv span{color:var(--mut)}.kv b{font-weight:500}
.kv3{grid-template-columns:auto auto 1fr}
.flag{margin:0 12px 10px;padding:8px 10px;border:1px solid rgba(245,166,35,.5);background:rgba(245,166,35,.08);color:var(--warn);font-size:12px;border-radius:4px;line-height:1.5}
.plan{border-top:1px solid var(--line);padding:6px 12px 10px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.plan-i{display:grid;grid-template-columns:36px 1fr 60px auto;gap:8px;align-items:center;padding:4px 0}
.plan-i.done b{color:var(--ok)}
.jrows{font-family:'IBM Plex Mono',monospace;font-size:12px}
.jrow{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.jrow span:last-child{font-family:'IBM Plex Sans KR'}
.jrow.up span:first-child{color:var(--up);font-weight:600}.jrow.warn span:first-child{color:var(--warn);font-weight:600}.jrow.down span:first-child{color:var(--dn);font-weight:600}
.jrow.warn{background:#262420}
/* 알림 */
.al-list{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);text-decoration:none;font-size:12.5px}
.al:first-child{border-top:0}.al:hover{background:var(--hi)}
.al-more{border:0;border-top:1px solid var(--line);border-radius:0}.al-more summary{background:transparent;color:var(--mut);font-weight:400}
/* 스크리너 */
.scr-list{display:flex;flex-direction:column}
.scr{display:grid;grid-template-columns:120px 130px 70px 60px 140px 1fr;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);text-decoration:none;font-size:12.5px}
.scr:first-child{border-top:0}.scr:hover{background:var(--hi)}
@media (max-width:900px){.scr{grid-template-columns:1fr 1fr;row-gap:4px}.scr span:last-child{grid-column:1/3}}
/* 이벤트 */
.ev-list{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:64px auto 1fr;gap:10px;align-items:start;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45}
.ev:first-child{border-top:0}.ev small{display:block;font-size:10px;color:var(--mut)}
/* 오늘 볼 것 */
.todo-list{display:flex;flex-direction:column}
.todo-i{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start;padding:9px 12px;border-top:1px solid var(--line);font-size:13px;line-height:1.5;cursor:pointer}
.todo-i:first-child{border-top:0}
.todo-i input{display:none}
.todo-i .box{width:16px;height:16px;border:1px solid #4A4A4A;border-radius:3px;margin-top:3px;position:relative}
.todo-i.done .box{background:var(--ok);border-color:var(--ok)}.todo-i.done .box::after{content:'';position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #111;border-width:0 2px 2px 0;transform:rotate(45deg)}
.todo-i.done span:last-child{color:var(--mut);text-decoration:line-through}
.todo-i .chip{margin-top:2px}
/* 시그널 4칸 */
.sigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sig{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin:0 4px}.dots i{width:9px;height:9px;border-radius:5px;border:1px solid #4A4A4A}.dots i.on{background:var(--up);border-color:var(--up)}
.sig-k{font-size:11px;color:var(--mut)}.sig-v{font-size:17px;font-weight:600;margin:2px 0}.sig-d{font-size:11px;color:var(--dim);line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.grid2b{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;align-items:start}
#chart{height:380px}
.clegend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 12px 8px;font-size:11px;color:var(--dim);border-top:1px solid var(--line)}
.clegend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}.clegend i.dash{height:0;border-top:2px dashed}
details{border:1px solid var(--line);border-radius:6px;padding:0}
details summary{padding:8px 12px;background:var(--panel);cursor:pointer;font-weight:600;font-size:12px;color:var(--dim)}
.term{border-bottom:1px dotted var(--mut);cursor:help}
#tip{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);max-width:min(560px,92vw);background:var(--track);color:var(--txt);padding:12px 14px;border-radius:8px;border:1px solid var(--ctl);font-size:13px;line-height:1.5;opacity:0;pointer-events:none;transition:.15s;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#tip.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#tip b{display:block;margin-bottom:4px;color:var(--w)}
.btn{padding:6px 12px;border-radius:4px;border:1px solid var(--ctl);background:var(--nav);color:var(--txt);font:inherit;cursor:pointer}
.btn.pri{background:var(--ctl);color:var(--w)}
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav{display:none}
  main{padding:12px 12px 84px;gap:12px}
  .mkts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mk-v{font-size:17px}
  .cards{grid-template-columns:1fr}
  .sigs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid2b{grid-template-columns:1fr}
  #chart{height:280px}
  .legend{display:none}
  .headline{font-size:15px}
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;grid-template-columns:repeat(4,1fr);background:var(--nav);border-top:1px solid var(--line);font-size:11px;text-align:center;padding-bottom:env(safe-area-inset-bottom);z-index:40}
  .tabbar a{padding:10px 0 12px;color:var(--mut);text-decoration:none;border-top:2px solid transparent}
  .tabbar a.on{color:var(--w);font-weight:600;border-top-color:var(--w)}
  #tip{bottom:70px}
  .al{grid-template-columns:auto 1fr;row-gap:3px}.al .dim{grid-column:1/3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px}
  .ev{grid-template-columns:56px auto 1fr}
  .tr{grid-template-columns:132px 76px 1fr 54px;gap:6px;padding:9px 10px}.tr .n>span{min-width:0;overflow:hidden}.tr .n>span{white-space:nowrap;text-overflow:ellipsis}
  .tr .hd{display:none}.tr .n{font-size:13px}.tr .pr{font-size:13px}
  .tr:first-child{display:none}
  .mcs{grid-template-columns:1fr 1fr}.mc-v{font-size:16px}
  .jk{grid-template-columns:1fr 1fr}.jk>div:nth-child(3){border-left:0}.jk>div:nth-child(n+3){border-top:1px solid var(--line)}.pp-sum{grid-template-columns:1fr 1fr}
  .bp-c{padding:10px 8px}.bp-r{flex-direction:column;gap:0}.bp-h small{display:block;margin:0}
  .fs{grid-template-columns:1fr 1fr;row-gap:10px}.fr{grid-template-columns:76px 1fr 1fr;gap:6px;padding:7px 10px}.fr>.chip,.fr.hd>span:last-child{display:none}.fr-v{grid-template-columns:1fr;gap:1px}.fr-v small{text-align:left}
  .axes{grid-template-columns:1fr 1fr}.ax:nth-child(odd){border-left:0}.ax{border-top:1px solid var(--line)}.ax:nth-child(-n+2){border-top:0}.ax.hl{grid-column:1/3;border-left:0}
  .sc2-l{grid-template-columns:1fr}
  .trk-g{grid-template-columns:1fr;gap:12px}
  .tkr{grid-template-columns:38px 1fr 64px;row-gap:4px;padding:8px 10px}.tkr .tkr-p{grid-column:1/4}.tkr>span:last-child{display:none}
  .mini .lab{display:none}.mini .md{display:block}
}
</style>
